<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WASTELAND</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
  <pattern id="hatchR" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#8b3a2b" stroke-width="2"/></pattern>
  <pattern id="hatchB" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#4d6071" stroke-width="1.6"/></pattern>
  <clipPath id="hp-clip"><rect id="hp-rect" x="0" y="56" width="64" height="64"/></clipPath>
</svg>
<div id="fx" aria-hidden="true"><div id="fx-hp"></div><div id="fx-san"></div></div>

<!-- 타이틀 화면 -->
<section id="title">
  <div class="title-box">
    <h1>WASTELAND</h1>
    <p class="sub">문명이 무너진 세계의 탐험 기록</p>
    <div class="title-menu">
      <button id="t-continue" hidden>이어하기</button>
      <button id="t-start">새 게임</button>
      <button id="t-settings">설정</button>
    </div>
  </div>
  <small class="ver">텍스트 탐험·생존 RPG · 프로토타입</small>
</section>

<!-- 게임 화면 -->
<main id="app">
  <header>
    <h2 id="logo">WASTELAND</h2>
    <nav>
      <button id="btn-inv">가방</button>
      <button id="btn-log">기록</button>
      <button id="btn-settings">설정</button>
      <button id="btn-title">타이틀</button>
    </nav>
  </header>

  <section id="map" aria-label="지도">
    <div id="map-img"></div>
    <div id="map-title"></div>
    <div id="nodes"></div>
    <button id="btn-back" hidden>← 세계 지도</button>
  </section>

  <footer id="status">
    <div class="vital hp" id="v-hp">
      <svg class="ico" viewBox="0 0 64 64" aria-hidden="true"><g class="beat">
        <path class="bg" d="M32 56 C8 40 4 22 14 14 C22 8 30 12 32 19 C34 12 42 8 50 14 C60 22 56 40 32 56Z"/>
        <g clip-path="url(#hp-clip)"><path d="M32 56 C8 40 4 22 14 14 C22 8 30 12 32 19 C34 12 42 8 50 14 C60 22 56 40 32 56Z" fill="#8b3a2b" fill-opacity=".5"/><path d="M32 56 C8 40 4 22 14 14 C22 8 30 12 32 19 C34 12 42 8 50 14 C60 22 56 40 32 56Z" fill="url(#hatchR)"/></g>
        <path class="line" d="M32 56 C8 40 4 22 14 14 C22 8 30 12 32 19 C34 12 42 8 50 14 C60 22 56 40 32 56Z" filter="url(#rough)"/>
      </g></svg>
      <div class="txt"><span class="lab">체력</span><b id="hp-num"></b><i id="hp-state"></i><div id="hp-bar" class="bar"></div></div>
    </div>
    <div class="vital san" id="v-san">
      <svg class="ico" viewBox="0 0 64 64" aria-hidden="true"><g class="eye">
        <path class="bg" d="M3 32 Q32 6 61 32 Q32 58 3 32Z"/>
        <circle cx="32" cy="32" r="12" fill="url(#hatchB)"/><circle cx="32" cy="32" r="12" class="line"/>
        <circle id="pupil" cx="32" cy="32" r="4" fill="#1d1c1a"/><circle cx="28.5" cy="28.5" r="2" fill="#e6e3d9"/>
        <path class="line" d="M3 32 Q32 6 61 32 Q32 58 3 32Z" filter="url(#rough)"/>
        <g id="scribbles"></g>
      </g></svg>
      <div class="txt"><span class="lab">정신력</span><b id="san-num"></b><i id="san-state"></i><div id="san-bar" class="bar"></div></div>
    </div>
  </footer>
</main>

<div id="modal" hidden><div id="sheet"></div></div>

<script src="data/world.js"></script>
<script src="data/events.js"></script>
<script src="js/sound.js"></script>
<script src="js/engine.js"></script>
<script>
// 파일 위치가 잘못되어 스크립트가 로드되지 않았을 때 안내를 표시합니다.
window.addEventListener("load", function(){
  var miss = [];
  if(!window.GAME_DATA) miss.push("data/world.js");
  else if(!window.GAME_DATA.events) miss.push("data/events.js");
  if(!window.__wastelandLoaded) miss.push("js/engine.js");
  if(miss.length){
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99;padding:14px;background:#400;color:#fff;font:14px/1.6 sans-serif;text-align:center";
    d.textContent = "로드 실패: " + miss.join(", ") + " 파일이 없거나 위치가 잘못되었습니다. 저장소 폴더 구조를 확인하세요. (F12 → Console/Network에서 404 확인)";
    document.body.appendChild(d);
  }
});
</script>
</body>
</html>
